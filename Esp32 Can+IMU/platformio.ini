[platformio]
default_envs = v1-debug

[env:esp32-s3-wroom-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*

board_upload.flash_size = 8MB
board_build.flash_mode = dio

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CAN_REQUIRE_ACK=0
    -D MQTT_MAX_PACKET_SIZE=8192

lib_deps =
    mathieucarbou/ESPAsyncWebServer@^3.3.23
    bblanchon/ArduinoJson@^7.3.1
    knolleary/PubSubClient@^2.8

; ============================================================================
; V1 PCB - ISM6HG256X (WHO_AM_I: 0x73) @ 192.168.8.185
; ============================================================================
[env:v1-debug]
extends = env:esp32-s3-wroom-1
upload_speed = 115200
build_unflags =
    -D CORE_DEBUG_LEVEL=0
build_flags =
    ${env:esp32-s3-wroom-1.build_flags}
    -D CORE_DEBUG_LEVEL=5
    -D IMU_SPI_DEBUG=1

[env:v1-ota]
extends = env:v1-debug
upload_protocol = espota
upload_port = 192.168.8.185
upload_flags = --auth=password

; ============================================================================
; V2 PCB - ISM6HG256X (WHO_AM_I: 0x73) @ 192.168.8.181
; ============================================================================
[env:v2-debug]
extends = env:esp32-s3-wroom-1
upload_speed = 115200
build_unflags =
    -D CORE_DEBUG_LEVEL=0
build_flags =
    ${env:esp32-s3-wroom-1.build_flags}
    -D CORE_DEBUG_LEVEL=5
    -D IMU_SPI_DEBUG=1

[env:v2-ota]
extends = env:v2-debug
upload_protocol = espota
upload_port = 192.168.8.181
upload_flags = --auth=password
